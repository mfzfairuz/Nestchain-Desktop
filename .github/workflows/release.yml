# Bangun installer Windows (NestchainSetup-x.y.z.exe) dan Mac (Nestchain-x.y.z.dmg) lalu terbitkan ke
# GitHub Releases setiap kali ada tag v*, misalnya: git tag v0.1.0 && git push origin v0.1.0
# electron-updater membaca latest.yml / latest-mac.yml dari release itu untuk pembaruan otomatis.
#
# Tanda tangan kode belum dipasang. Saat akun Apple Developer dan sertifikat sudah ada, tambahkan
# rahasia repo CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID dan
# teruskan ke env langkah Mac; jangan meneruskan variabel kosong karena electron-builder membacanya sebagai berkas.
name: Rilis desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bangun:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bangun dan terbitkan (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bangun dan terbitkan (Mac, tanpa tanda tangan)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
